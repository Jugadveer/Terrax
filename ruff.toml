line-length = 96
target-version = "py311"
exclude = ["*/migrations/*", ".venv311", ".claude", "staticfiles"]

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ"]
ignore = [
  "E501",   # long lines are a judgement call, not a rule
  "B008",   # Django uses callables in defaults
  "DJ001",  # null=True on CharField is deliberate where a value is genuinely absent
]

[lint.isort]
known-first-party = ["accounts", "terrax", "chain", "core", "intelligence", "market", "properties"]
